# Runs on every push and pull request. The point of having it is that "there are tests" stops
# being a claim in the README and becomes something a stranger can verify by looking at the
# commit list.
name: build

# Once for a branch push, once for a pull request — never both. Listing feature branches under
# push as well ran every job twice while a PR was open: the same commit, the same result, two
# entries in the checks list and twice the runner time.
on:
  push:
    branches: [master]
  pull_request:

# Pushing three commits in a minute used to start three full runs and wait for all of them. Only
# the newest matters, so the older ones are cancelled — except on master, where each commit's
# result is a record worth keeping.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore is a separate step so a package that fails to download is reported as what it is,
      # rather than surfacing later as a compile error about a missing type.
      - name: Restore
        run: dotnet restore ServerMonitor.slnx

      # Warnings fail the build. The repository has none today, and the cheapest moment to keep
      # it that way is before the first one lands. A side effect worth knowing about: a new NuGet
      # security advisory turns this red without a line of code changing. That is information.
      - name: Build
        run: dotnet build ServerMonitor.slnx --no-restore --configuration Release -warnaserror

      # The integration tests start PostgreSQL in a throwaway container, and Docker is already on
      # the runner. That is what makes them worth running here: they exercise the foreign keys,
      # cascade deletes and authorization filters that do not exist inside a unit test — which is
      # exactly the category both of this project's silent defects belonged to.
      - name: Test
        run: dotnet test ServerMonitor.slnx --no-build --configuration Release

  docker:
    name: Container images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Catches a malformed compose file, or a variable referenced and never defined, without
      # starting anything. .env.example stands in for the real secrets; it holds placeholders.
      - name: Validate compose
        run: docker compose --env-file .env.example config --quiet

      # The README promises that `docker compose up` works from a clean checkout. Building the
      # images here is the only thing that keeps that promise true as the Dockerfiles change.
      - name: Build images
        run: docker compose --env-file .env.example build

  package:
    name: Agent packages
    # The same packages a release publishes, built for every pull request. A change that breaks
    # packaging then fails here, in review, rather than on the day a release is tagged.
    uses: ./.github/workflows/package-agent.yml
    with:
      version: 0.0.0-ci

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # These run as root on other people's machines, and a shell script's mistakes surface only at
      # run time: an unquoted variable, a failure silently ignored. shellcheck finds most of that
      # class without running anything.
      - name: shellcheck
        run: shellcheck deploy/install.sh deploy/agent/install.sh

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path deploy/agent/install.ps1 -Severity Warning, Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
