# Publishes a release when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The installers download the agent from the latest release, so a tag is what carries a change in the
# agent to the machines being watched: until one is pushed, new installs keep getting the previous
# agent. Tag a commit on master that the build has already passed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      # A tag that is not a version would stamp nonsense into every agent the release ships.
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag such as v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/package-agent.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: servermonitor-agent-*
          merge-multiple: true
          path: dist

      # The installers check what they download against this file, which catches an archive that
      # arrived damaged or cut short.
      - name: Checksums
        working-directory: dist
        run: sha256sum servermonitor-agent-* > SHA256SUMS

      # A tag with a suffix, such as v1.3.0-rc.1, becomes a pre-release, which "latest" skips: a
      # release candidate is not what a new machine should be handed by default.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
